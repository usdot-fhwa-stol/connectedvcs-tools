spring:
  application:
    name: fedgov-cv-map-georeferencing

server:
  port: 8080

# Georeferencing configuration
georeference:
  image:
    supported-formats:
      - image/png
      - image/jpeg
      - image/jpg
    max-size: 50MB
  gcp:
    min-count: 4
    max-count: 10
  gdal:
    timeout-seconds: 120
  warp:
    # Transform method for gdalwarp. Options:
    #   tps    - Thin Plate Spline (smooth, interpolates through all GCPs, best for manual point picking)
    #   order1 - 1st-order polynomial (affine: rotation, scale, skew — no perspective)
    #   order2 - 2nd-order polynomial (adds curvature, needs 6+ GCPs)
    #   order3 - 3rd-order polynomial (more flexible, needs 10+ GCPs, sensitive to noise)
    transform-method: tps
    # Resampling method. Options: bilinear, cubic, nearest, lanczos
    resampling-method: bilinear
