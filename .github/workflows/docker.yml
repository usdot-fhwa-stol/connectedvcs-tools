name: Docker build
on:
  pull_request:
    branches:
      - develop
      - master
      - 'release/**'
    types: [opened, synchronize, reopened]

permissions:
  contents: read
  pull-requests: write

jobs:
  determine_docker_org_and_tag:
    runs-on: ubuntu-latest
    outputs:
      docker_organization: ${{ steps.docker-org-and-tag.outputs.docker_organization }}
      docker_image_tag: ${{ steps.docker-org-and-tag.outputs.docker_image_tag }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - id: docker-org-and-tag
        uses: usdot-fhwa-stol/actions/docker-org-and-tag@main

  connectedvcs-tools:
    needs: determine_docker_org_and_tag
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4
      - name: Login to DockerHub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./Dockerfile
          load: true
          build-args: |
          tags: ${{ needs.determine_docker_org_and_tag.outputs.docker_organization }}/connectedvcs-tools:pr-${{ github.event.pull_request.number }}
      
      # Compare PR image against the base branch env on Docker Scout and post results to the PR
      - name: Docker Scout Compare connectedvcs-tools
        uses: docker/scout-action@v1
        with:
          command: compare
          image: ${{ needs.determine_docker_org_and_tag.outputs.docker_organization }}/connectedvcs-tools:pr-${{ github.event.pull_request.number }}
          to-env: ${{ needs.determine_docker_org_and_tag.outputs.docker_image_tag }}
          ignore-unchanged: true
          only-severities: critical,high
          organization: ${{ needs.determine_docker_org_and_tag.outputs.docker_organization }}
          keep-previous-comments: true